name: Inspect Xcode Bundle Structure

on:
  workflow_dispatch: # Allows you to trigger the workflow manually from the GitHub UI

jobs:
  explore-xcode:
    runs-on: macos-14 # Uses a GitHub-hosted macOS runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Locate Pre-installed Xcode Versions
      run: |
        echo "=== Available Xcode Applications ==="
        ls -d /Applications/Xcode*.app

    - name: Select Active Xcode Version
      run: |
        # Point the command-line tools to the preferred Xcode version
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        xcodebuild -version

    - name: View Contents Directory Structure
      run: |
        echo "=== Listing top-level files inside Xcode bundle ==="
        ls -la /Applications/Xcode_15.4.app/Contents/

    - name: Archive Specific Internal Tooling
      run: |
        echo "=== Creating a tar.gz archive of the Developer utilities ==="
        # Compresses the Developer directory inside the Xcode bundle
        tar -czf xcode_dev_subset.tar.gz -C /Applications/Xcode_15.4.app/Contents/ Developer/

    - name: Upload Compressed Archive as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcode-developer-tools-archive
        path: xcode_dev_subset.tar.gz
